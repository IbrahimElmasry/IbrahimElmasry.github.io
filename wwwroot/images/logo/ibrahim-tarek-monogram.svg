<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 110" width="100%" height="100%" fill="none">
  <defs>
    <!-- Executive Titanium Surface Gradients -->
    <linearGradient id="titaniumFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="titaniumEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.3" />
    </linearGradient>

    <!-- Signature Electric Lime (.NET Ecosystem Accent) -->
    <linearGradient id="signatureLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4ffcd" />
      <stop offset="40%" stop-color="#c7f36b" />
      <stop offset="100%" stop-color="#93de2a" />
    </linearGradient>

    <!-- Refined Architectural Glow Filter -->
    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="limeBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g class="it-monogram-core">
    <!-- Ambient Neon Aura behind the letters (Subtle) -->
    <ellipse cx="65" cy="55" rx="45" ry="35" fill="#c7f36b" opacity="0.08" filter="url(#subtleGlow)" />

    <!-- ==============================================
         LETTER 'I' (Architectural Foundation Column)
         ============================================== -->
    <!-- 'I' Column: x: 18 to 38, y: 16 to 92 (Height: 76px, Width: 20px) -->
    <rect x="18" y="16" width="20" height="76" rx="3.5" fill="url(#titaniumFace)" stroke="url(#titaniumEdge)" stroke-width="1" />

    <!-- ==============================================
         LETTER 'T' (Architectural Cantilever & Pylon)
         ============================================== -->
    <!-- 'T' Horizontal Cantilever Lintel: x: 48 to 102, y: 16 to 34 (Width: 54px, Height: 18px) -->
    <rect x="48" y="16" width="54" height="18" rx="3.5" fill="url(#titaniumFace)" stroke="url(#titaniumEdge)" stroke-width="1" />

    <!-- 'T' Vertical Central Pylon: x: 65 to 85, y: 34 to 92 (Width: 20px, Height: 58px) -->
    <path d="M 65 34 L 85 34 L 85 88.5 C 85 90.43 83.43 92 81.5 92 L 68.5 92 C 66.57 92 65 90.43 65 88.5 Z" fill="url(#titaniumFace)" stroke="url(#titaniumEdge)" stroke-width="1" />

    <!-- Architectural Bevel Seam in 'T' (Subtle recessed relief) -->
    <line x1="66" y1="34" x2="84" y2="34" stroke="#090c10" stroke-width="1.2" opacity="0.4" />

    <!-- ==============================================
         SIGNATURE '.NET' ARCHITECTURAL DOT
         ============================================== -->
    <!-- Precision glowing lime dot at bottom right: echoes "Ibrahim Tarek." & ".NET" -->
    <circle cx="108" cy="85" r="5" fill="url(#signatureLime)" filter="url(#limeBloom)" />
    <!-- White core hot-spot -->
    <circle cx="108" cy="85" r="1.8" fill="#ffffff" />
  </g>
</svg>