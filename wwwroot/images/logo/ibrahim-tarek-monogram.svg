<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <defs>
    <!-- Brand Color Gradients -->
    <linearGradient id="limeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#efffc2" />
      <stop offset="40%" stop-color="#c7f36b" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <linearGradient id="cyanGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#8cefe3" />
    </linearGradient>

    <linearGradient id="violetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#a89cf9" />
    </linearGradient>

    <linearGradient id="titaniumDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="titaniumBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="scanBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c7f36b" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>

    <!-- High-Tech Neon Glow Filters -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambientHalo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur" />
    </filter>

    <filter id="neonPulseFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Holographic Glow Aura (Seamless transparency) -->
  <circle cx="120" cy="120" r="75" fill="#c7f36b" opacity="0.1" filter="url(#ambientHalo)" />
  <circle cx="140" cy="100" r="60" fill="#00f2fe" opacity="0.08" filter="url(#ambientHalo)" />

  <!-- Outer Architectural Reticle (Delicate blueprint accents) -->
  <g opacity="0.45" stroke="#c7f36b" stroke-width="1">
    <path d="M 28 45 L 28 28 L 45 28" fill="none" />
    <path d="M 212 45 L 212 28 L 195 28" fill="none" />
    <path d="M 28 195 L 28 212 L 45 212" fill="none" />
    <path d="M 212 195 L 212 212 L 195 212" fill="none" />
    <circle cx="120" cy="120" r="102" fill="none" stroke="#c7f36b" stroke-width="0.8" stroke-dasharray="4 8" opacity="0.3" />
  </g>

  <!-- ==============================================================
       LETTER "I" (Architectural West Pylon)
       ============================================================== -->
  <g class="monogram-i">
    <!-- "I" 3D Drop Extrusion -->
    <path d="M 44 68 L 68 44 L 92 68 L 92 172 L 68 196 L 44 172 Z" fill="#070a0e" opacity="0.95" />

    <!-- "I" Rear Chamfer Facet (Titanium) -->
    <path d="M 44 68 L 68 44 L 68 196 L 44 172 Z" fill="url(#titaniumDark)" />

    <!-- "I" Front Face (Electric Lime Gradient) -->
    <path d="M 68 44 L 92 68 L 92 172 L 68 196 Z" fill="url(#limeGradient)" filter="url(#coreGlow)" />

    <!-- "I" Chiseled Center Light Ridge -->
    <line x1="68" y1="44" x2="68" y2="196" stroke="#ffffff" stroke-width="2" opacity="0.9" />

    <!-- "I" Top Chamfer Serif Wing -->
    <polygon points="34,76 44,66 92,66 102,76 92,82 44,82" fill="url(#titaniumDark)" />
    <polygon points="44,66 68,44 92,66 68,72" fill="url(#limeGradient)" opacity="0.8" />

    <!-- "I" Bottom Base Chamfer Wing -->
    <polygon points="34,164 44,174 92,174 102,164 92,158 44,158" fill="url(#titaniumDark)" />
    <polygon points="44,174 68,196 92,174 68,168" fill="url(#limeGradient)" opacity="0.8" />

    <!-- "I" Embedded Circuit Spine (Clean Arch Data Pipeline) -->
    <line x1="68" y1="72" x2="68" y2="168" stroke="#090d12" stroke-width="4" stroke-linecap="round" />
    <line x1="68" y1="74" x2="68" y2="166" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="68" cy="74" r="3" fill="#ffffff" />
    <circle cx="68" cy="120" r="2.5" fill="#c7f36b" />
    <circle cx="68" cy="166" r="3" fill="#00f2fe" />
  </g>

  <!-- ==============================================================
       LETTER "T" (Architectural East Cantilever & Stem)
       ============================================================== -->
  <g class="monogram-t">
    <!-- "T" Crossbar Cantilever: spans from x: 104 to 206, y: 44 to 88 -->
    <!-- "T" 3D Extrusion Shadow -->
    <path d="M 104 68 L 126 44 L 198 44 L 208 54 L 208 78 L 198 88 L 166 88 L 166 172 L 146 192 L 126 172 L 126 88 L 104 88 Z" fill="#070a0e" opacity="0.95" />

    <!-- "T" Crossbar Upper Facet (Cyber Cyan to Teal) -->
    <polygon points="104,68 126,44 198,44 208,54 186,76 104,76" fill="url(#cyanGradient)" filter="url(#coreGlow)" />

    <!-- "T" Crossbar Chamfer Top Highlight -->
    <polygon points="126,44 198,44 208,54 136,54" fill="#ffffff" opacity="0.5" />

    <!-- "T" Crossbar Lower Facet (Titanium) -->
    <polygon points="104,76 186,76 198,88 166,88 126,88 104,88" fill="url(#titaniumDark)" />

    <!-- "T" Stem (Vertical Column): x: 126 to 166, y: 88 to 192 -->
    <!-- Stem Left Facet (Electric Lime to Emerald) -->
    <polygon points="126,88 146,88 146,192 126,172" fill="url(#limeGradient)" />

    <!-- Stem Right Facet (Cyber Violet to Titanium) -->
    <polygon points="146,88 166,88 166,172 146,192" fill="url(#violetGradient)" opacity="0.85" />

    <!-- "T" Stem Center Chiseled Ridge -->
    <line x1="146" y1="88" x2="146" y2="192" stroke="#ffffff" stroke-width="2" opacity="0.9" />

    <!-- "T" Circuits & Conduits -->
    <!-- Crossbar Horizontal Circuit -->
    <line x1="116" y1="62" x2="196" y2="62" stroke="#090d12" stroke-width="3.5" stroke-linecap="round" />
    <line x1="118" y1="62" x2="194" y2="62" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
    <circle cx="118" cy="62" r="2.5" fill="#c7f36b" />
    <circle cx="194" cy="62" r="2.5" fill="#00f2fe" />

    <!-- Stem Vertical Circuit -->
    <line x1="146" y1="96" x2="146" y2="168" stroke="#090d12" stroke-width="3.5" stroke-linecap="round" />
    <line x1="146" y1="98" x2="146" y2="166" stroke="#c7f36b" stroke-width="1.4" stroke-linecap="round" />
    <circle cx="146" cy="98" r="2.5" fill="#ffffff" />
    <circle cx="146" cy="132" r="2.5" fill="#00f2fe" />
    <circle cx="146" cy="166" r="2.5" fill="#ffffff" />
  </g>

  <!-- Glowing Laser Edge Perimeter Trace -->
  <path d="M 68 44 L 92 68 L 92 172 L 68 196 L 44 172 L 44 68 Z" fill="none" stroke="#c7f36b" stroke-width="1.8" opacity="0.85" filter="url(#neonPulseFilter)" />
  <path d="M 126 44 L 198 44 L 208 54 L 208 78 L 198 88 L 166 88 L 166 172 L 146 192 L 126 172 L 126 88 L 104 88 L 104 68 Z" fill="none" stroke="#00f2fe" stroke-width="1.8" opacity="0.85" filter="url(#neonPulseFilter)" />

  <!-- Quantum Data Stream Bridge between I and T -->
  <line x1="92" y1="76" x2="104" y2="76" stroke="#c7f36b" stroke-width="2" stroke-dasharray="2 2" opacity="0.9" />
  <line x1="92" y1="120" x2="126" y2="120" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
</svg>