<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%" fill="none">
  <defs>
    <!-- Executive Titanium Surface Gradients -->
    <linearGradient id="hTitaniumFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="hTitaniumEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="hSignatureLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4ffcd" />
      <stop offset="40%" stop-color="#c7f36b" />
      <stop offset="100%" stop-color="#93de2a" />
    </linearGradient>

    <filter id="hLimeBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Clean Monogram Scaled to fit ~65px height -->
  <g transform="translate(10, 10) scale(0.64)">
    <!-- 'I' Column -->
    <rect x="18" y="16" width="20" height="76" rx="3.5" fill="url(#hTitaniumFace)" stroke="url(#hTitaniumEdge)" stroke-width="1" />

    <!-- 'T' Lintel -->
    <rect x="48" y="16" width="54" height="18" rx="3.5" fill="url(#hTitaniumFace)" stroke="url(#hTitaniumEdge)" stroke-width="1" />

    <!-- 'T' Pylon -->
    <path d="M 65 34 L 85 34 L 85 88.5 C 85 90.43 83.43 92 81.5 92 L 68.5 92 C 66.57 92 65 90.43 65 88.5 Z" fill="url(#hTitaniumFace)" stroke="url(#hTitaniumEdge)" stroke-width="1" />

    <!-- Signature Lime Dot -->
    <circle cx="108" cy="85" r="5" fill="url(#hSignatureLime)" filter="url(#hLimeBloom)" />
    <circle cx="108" cy="85" r="1.8" fill="#ffffff" />
  </g>

  <!-- Divider -->
  <line x1="102" y1="22" x2="102" y2="68" stroke="#25303b" stroke-width="1.2" />

  <!-- Typography -->
  <text x="122" y="44" font-family="'Manrope', sans-serif" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="-0.03em">
    Ibrahim Tarek<tspan fill="#c7f36b">.</tspan>
  </text>
  <text x="123" y="64" font-family="'DM Mono', monospace" font-size="11" font-weight="700" fill="#a89cf9" letter-spacing="0.18em">
    .NET ARCHITECT &amp; SOFTWARE ENGINEER
  </text>
</svg>
