<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 90" width="100%" height="100%">
  <defs>
    <linearGradient id="brandNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7f36b" />
      <stop offset="100%" stop-color="#a89cf9" />
    </linearGradient>
    <radialGradient id="markGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c7f36b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#090b0e" stop-opacity="0" />
    </radialGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow behind mark -->
  <circle cx="45" cy="45" r="40" fill="url(#markGlow)" />

  <!-- Mark Container -->
  <g transform="translate(10, 10) scale(0.58)">
    <rect x="6" y="6" width="108" height="108" rx="26" fill="#101418" stroke="url(#brandNeon)" stroke-width="2.5" />
    
    <!-- I Letterform -->
    <polygon points="30,26 48,26 44,34 30,34" fill="#242c33" stroke="#c7f36b" stroke-width="2" />
    <polygon points="34,35 44,35 44,82 34,88" fill="#161c22" stroke="#c7f36b" stroke-width="2" />
    <polygon points="26,88 52,88 46,94 22,94" fill="#242c33" stroke="#c7f36b" stroke-width="2" />
    <polygon points="34,54 44,48 44,56 34,62" fill="#c7f36b" />

    <!-- T Letterform -->
    <polygon points="52,26 96,26 92,36 60,36" fill="#242c33" stroke="#a89cf9" stroke-width="2" />
    <polygon points="96,26 90,36 82,36 92,26" fill="#a89cf9" />
    <polygon points="60,37 72,37 72,94 60,86" fill="#161c22" stroke="#a89cf9" stroke-width="2" />
    <polygon points="47,42 56,33 58,37 49,46" fill="url(#brandNeon)" />

    <circle cx="94" cy="24" r="3" fill="#c7f36b" filter="url(#subtleGlow)" />
  </g>

  <!-- Typography -->
  <g transform="translate(95, 0)">
    <!-- Main Name -->
    <text x="0" y="44" fill="#f8fafc" font-family="'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" letter-spacing="1.5">
      IBRAHIM TAREK<tspan fill="#c7f36b">.</tspan>
    </text>

    <!-- Subtitle / Discipline -->
    <text x="1" y="66" fill="#94a3b8" font-family="'DM Mono', 'Cascadia Code', monospace" font-size="11" font-weight="600" letter-spacing="2.8">
      .NET ARCHITECT <tspan fill="#a89cf9">|</tspan> FULL-STACK
    </text>
  </g>
</svg>
