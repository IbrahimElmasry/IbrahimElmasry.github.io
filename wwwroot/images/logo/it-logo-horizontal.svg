<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%" fill="none">
  <defs>
    <!-- Brand Color Gradients -->
    <linearGradient id="hLimeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#efffc2" />
      <stop offset="40%" stop-color="#c7f36b" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <linearGradient id="hCyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#8cefe3" />
    </linearGradient>

    <linearGradient id="hVioletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#a89cf9" />
    </linearGradient>

    <linearGradient id="hTitaniumDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Monogram Mark Scaled to fit 80x80 box at x=5, y=5 -->
  <g transform="translate(5, 5) scale(0.333)">
    <!-- Ambient Aura -->
    <circle cx="120" cy="120" r="80" fill="#c7f36b" opacity="0.1" />

    <!-- "I" Pillar -->
    <path d="M 44 68 L 68 44 L 92 68 L 92 172 L 68 196 L 44 172 Z" fill="#070a0e" opacity="0.95" />
    <path d="M 44 68 L 68 44 L 68 196 L 44 172 Z" fill="url(#hTitaniumDark)" />
    <path d="M 68 44 L 92 68 L 92 172 L 68 196 Z" fill="url(#hLimeGrad)" filter="url(#hGlow)" />
    <line x1="68" y1="44" x2="68" y2="196" stroke="#ffffff" stroke-width="2.5" opacity="0.9" />

    <!-- "I" Chamfers -->
    <polygon points="34,76 44,66 92,66 102,76 92,82 44,82" fill="url(#hTitaniumDark)" />
    <polygon points="44,66 68,44 92,66 68,72" fill="url(#hLimeGrad)" opacity="0.8" />
    <polygon points="34,164 44,174 92,174 102,164 92,158 44,158" fill="url(#hTitaniumDark)" />
    <polygon points="44,174 68,196 92,174 68,168" fill="url(#hLimeGrad)" opacity="0.8" />

    <!-- "I" Circuit -->
    <line x1="68" y1="72" x2="68" y2="168" stroke="#090d12" stroke-width="4" stroke-linecap="round" />
    <line x1="68" y1="74" x2="68" y2="166" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="68" cy="74" r="3" fill="#ffffff" />
    <circle cx="68" cy="120" r="2.5" fill="#c7f36b" />
    <circle cx="68" cy="166" r="3" fill="#00f2fe" />

    <!-- "T" Cantilever & Stem -->
    <path d="M 104 68 L 126 44 L 198 44 L 208 54 L 208 78 L 198 88 L 166 88 L 166 172 L 146 192 L 126 172 L 126 88 L 104 88 Z" fill="#070a0e" opacity="0.95" />
    <polygon points="104,68 126,44 198,44 208,54 186,76 104,76" fill="url(#hCyanGrad)" filter="url(#hGlow)" />
    <polygon points="126,44 198,44 208,54 136,54" fill="#ffffff" opacity="0.5" />
    <polygon points="104,76 186,76 198,88 166,88 126,88 104,88" fill="url(#hTitaniumDark)" />

    <polygon points="126,88 146,88 146,192 126,172" fill="url(#hLimeGrad)" />
    <polygon points="146,88 166,88 166,172 146,192" fill="url(#hVioletGrad)" opacity="0.85" />
    <line x1="146" y1="88" x2="146" y2="192" stroke="#ffffff" stroke-width="2.5" opacity="0.9" />

    <!-- "T" Circuits -->
    <line x1="116" y1="62" x2="196" y2="62" stroke="#090d12" stroke-width="3.5" stroke-linecap="round" />
    <line x1="118" y1="62" x2="194" y2="62" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
    <circle cx="118" cy="62" r="2.5" fill="#c7f36b" />
    <circle cx="194" cy="62" r="2.5" fill="#00f2fe" />

    <line x1="146" y1="96" x2="146" y2="168" stroke="#090d12" stroke-width="3.5" stroke-linecap="round" />
    <line x1="146" y1="98" x2="146" y2="166" stroke="#c7f36b" stroke-width="1.4" stroke-linecap="round" />
    <circle cx="146" cy="98" r="2.5" fill="#ffffff" />
    <circle cx="146" cy="132" r="2.5" fill="#00f2fe" />
    <circle cx="146" cy="166" r="2.5" fill="#ffffff" />

    <!-- Perimeter Edge Highlight -->
    <path d="M 68 44 L 92 68 L 92 172 L 68 196 L 44 172 L 44 68 Z" fill="none" stroke="#c7f36b" stroke-width="1.8" opacity="0.85" />
    <path d="M 126 44 L 198 44 L 208 54 L 208 78 L 198 88 L 166 88 L 166 172 L 146 192 L 126 172 L 126 88 L 104 88 L 104 68 Z" fill="none" stroke="#00f2fe" stroke-width="1.8" opacity="0.85" />
  </g>

  <!-- Divider Line -->
  <line x1="98" y1="22" x2="98" y2="68" stroke="#25303b" stroke-width="1.5" />

  <!-- Typography -->
  <text x="115" y="44" font-family="'Manrope', sans-serif" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="-0.03em">
    Ibrahim Tarek<tspan fill="#c7f36b">.</tspan>
  </text>
  <text x="116" y="64" font-family="'DM Mono', monospace" font-size="11" font-weight="700" fill="#a89cf9" letter-spacing="0.18em">
    .NET ARCHITECT &amp; SOFTWARE ENGINEER
  </text>
</svg>
