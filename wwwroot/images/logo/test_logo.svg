<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="gradLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9ff85"/>
      <stop offset="50%" stop-color="#c7f36b"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8cefe3"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="gradViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="60%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#a89cf9"/>
    </linearGradient>
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Underglow -->
  <circle cx="80" cy="80" r="55" fill="#c7f36b" opacity="0.12" filter="blur(20px)"/>

  <!-- LETTER "I" (Architectural Column) -->
  <!-- Main Column Body -->
  <path d="M 28 26 L 52 26 L 52 134 L 28 134 Z" fill="url(#gradLime)"/>
  <!-- Top Chamfer Accents -->
  <polygon points="28,26 40,14 52,26" fill="url(#gradCyan)"/>
  <!-- Inner Circuit Vein -->
  <line x1="40" y1="28" x2="40" y2="132" stroke="#090b0e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="40" cy="36" r="3" fill="#ffffff"/>
  <circle cx="40" cy="122" r="3" fill="#ffffff"/>

  <!-- LETTER "T" (Architectural Crossbar & Stem) -->
  <!-- Crossbar Lintel -->
  <polygon points="62,14 136,14 144,22 144,38 132,50 62,50" fill="url(#gradCyan)"/>
  <!-- Stem -->
  <polygon points="86,50 114,50 114,134 86,134" fill="url(#gradViolet)"/>
  <!-- T Accent Chamfer & Negative Cut -->
  <polygon points="114,134 100,148 86,134" fill="url(#gradLime)"/>
  
  <!-- Circuit Vein in T -->
  <path d="M 72 32 L 100 32 L 100 126" fill="none" stroke="#090b0e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="100" cy="126" r="3" fill="#c7f36b"/>
  <circle cx="72" cy="32" r="3" fill="#ffffff"/>

</svg>