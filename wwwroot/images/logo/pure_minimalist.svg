<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pureTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="limeGlowPure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#efffc2"/>
      <stop offset="100%" stop-color="#c7f36b"/>
    </linearGradient>
    <filter id="pureGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Clean, bold, architectural letter "I" -->
  <path d="M 18 22 L 36 22 L 36 82 L 18 82 Z" fill="url(#pureTitanium)"/>
  
  <!-- Architectural letter "T" with precision cut -->
  <path d="M 44 22 L 86 22 L 86 36 L 72 36 L 72 82 L 54 82 L 54 36 L 44 36 Z" fill="url(#pureTitanium)"/>

  <!-- Signature Electric Lime Dot (The .NET / Software Architecture Dot) -->
  <circle cx="91" cy="80" r="4.5" fill="url(#limeGlowPure)" filter="url(#pureGlow)"/>
</svg>