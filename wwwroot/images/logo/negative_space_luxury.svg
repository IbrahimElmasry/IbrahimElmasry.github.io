<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2631"/>
      <stop offset="50%" stop-color="#131920"/>
      <stop offset="100%" stop-color="#0b0e12"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#c7f36b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38ef7d" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="limeLaserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9ff85"/>
      <stop offset="100%" stop-color="#c7f36b"/>
    </linearGradient>
    <filter id="subtleAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sleek, dark titanium rounded chassis -->
  <rect x="8" y="8" width="104" height="104" rx="24" fill="url(#shieldGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Inside: Bold, minimalist geometric 'IT' letterforms -->
  <!-- 'I' Column: x=28 to x=44, y=32 to y=88 -->
  <rect x="28" y="32" width="16" height="56" rx="4" fill="url(#letterGrad)"/>

  <!-- 'T' Crossbar: x=52 to x=92, y=32 to y=46 -->
  <rect x="52" y="32" width="40" height="14" rx="4" fill="url(#letterGrad)"/>

  <!-- 'T' Stem: x=65 to x=79, y=46 to y=88 -->
  <rect x="65" y="44" width="14" height="44" rx="3" fill="url(#letterGrad)"/>

  <!-- Luminous Lime Precision Dot at top-right of 'I' -->
  <circle cx="36" cy="24" r="3" fill="url(#limeLaserGrad)" filter="url(#subtleAura)"/>
</svg>