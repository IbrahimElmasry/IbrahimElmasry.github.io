<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#141c18" />
      <stop offset="100%" stop-color="#090b0e" />
    </radialGradient>
    <linearGradient id="favNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7f36b" />
      <stop offset="100%" stop-color="#a89cf9" />
    </linearGradient>
    <filter id="favGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favBg)" stroke="url(#favNeon)" stroke-width="1.6" />
  
  <g transform="translate(1, 0)" filter="url(#favGlow)">
    <!-- I form -->
    <polygon points="16,14 26,14 24,19 16,19" fill="#242c33" stroke="#c7f36b" stroke-width="1.2" />
    <polygon points="18,19 24,19 24,44 18,48" fill="#14191e" stroke="#c7f36b" stroke-width="1.2" />
    <polygon points="14,48 28,48 25,51 12,51" fill="#242c33" stroke="#c7f36b" stroke-width="1.2" />
    <polygon points="18,30 24,26 24,31 18,35" fill="#c7f36b" />

    <!-- T form -->
    <polygon points="28,14 51,14 49,20 33,20" fill="#242c33" stroke="#a89cf9" stroke-width="1.2" />
    <polygon points="51,14 48,20 44,20 49,14" fill="#a89cf9" />
    <polygon points="33,20 40,20 40,51 33,46" fill="#14191e" stroke="#a89cf9" stroke-width="1.2" />
    
    <!-- Cyber Shard -->
    <polygon points="25,24 30,19 32,21 27,27" fill="url(#favNeon)" />
    <circle cx="50" cy="13" r="1.6" fill="#c7f36b" />
  </g>
</svg>
