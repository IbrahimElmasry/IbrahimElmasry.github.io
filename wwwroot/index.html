<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ibrahim Tarek — ASP.NET Developer</title>
    <base href="/" />
    <meta name="theme-color" content="#090b0e" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260924-1" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/motion.css?v=20260924-6" />
    <link rel="stylesheet" href="css/polish.css?v=20260924-11" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#422;color:white;padding:12px;z-index:20">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>window.portfolioBasePath = window.portfolioBasePath || '/'; window.portfolioBaseSegments = window.portfolioBaseSegments || 0;</script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
      (function () {
        const base = document.querySelector('base');
        const segments = location.pathname.split('/').filter(Boolean);
        const segmentCount = window.portfolioBaseSegments ?? 0;
        base.href = window.portfolioBasePath ?? ('/' + segments.slice(0, segmentCount).join('/') + (segmentCount ? '/' : ''));
        const params = new URLSearchParams(location.search);
        const route = params.get('p');
        if (route !== null) {
          params.delete('p');
          history.replaceState(null, '', base.href + route + (params.toString() ? '?' + params.toString() : '') + location.hash);
        }
      })();
    </script>
</body>

</html>
