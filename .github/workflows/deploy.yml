name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Blazor WebAssembly
        run: dotnet publish PortfolioApp.csproj -c Release -o publish
      - name: Prepare GitHub Pages artifact
        shell: bash
        env:
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
        run: |
          base_path="/${PAGES_BASE_PATH}/"
          if [ "$PAGES_BASE_PATH" = "" ]; then base_path="/"; fi
          export PAGES_BASE_PATH
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path("publish/wwwroot/index.html")
          content = path.read_text()
          base = os.environ.get("PAGES_BASE_PATH", "")
          href = f"/{base}/" if base else "/"
          path.write_text(content.replace('<base href="/" />', f'<base href="{href}" />'))
          PY
          cp wwwroot/404.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll
          segments=0
          if [ -n "$PAGES_BASE_PATH" ]; then segments=1; fi
          echo "window.portfolioBasePath='${base_path}'; window.portfolioBaseSegments=${segments};" > publish/wwwroot/pages-config.js
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path("publish/wwwroot/404.html")
          html = path.read_text()
          base = f"/{os.environ.get('PAGES_BASE_PATH', '')}/" if os.environ.get('PAGES_BASE_PATH') else "/"
          html = html.replace("window.portfolioBasePath || '/'", repr(base))
          path.write_text(html)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
